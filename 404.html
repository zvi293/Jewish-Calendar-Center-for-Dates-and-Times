    <style>

        padding: 2.5rem 2rem;

        background: linear-gradient(135deg, #e8c15a, #f2d98a);
        color: #1e293b;
        font-weight: 900;
        font-size: 1rem;
        padding: 0.7rem 2.2rem;
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 4px 18px rgba(232,193,90,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .home:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(232,193,90,0.5); }
      nav { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid rgba(148,180,255,0.15); display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; justify-content: center; }
