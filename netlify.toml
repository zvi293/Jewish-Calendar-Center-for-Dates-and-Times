# Netlify build pipeline.
# On every deploy, Netlify recompiles tailwind.css from the current HTML/JS.
# This means you can add new Tailwind classes anywhere and they "just work"
# after a push — no manual build step needed.
[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# ביטול שכתוב הקישורים של Netlify ("Pretty URLs"): הוא שכתב בדיפלוי את
# href="synagogues.html" ל-href='/synagogues' — בעוד ה-canonical וה-sitemap
# מצביעים על צורת ה-.html. איתות סריקה מעורב + HTML מפורסם שלא תואם לריפו.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false

# ── הפניות ──
# אין כאן 301 מהדומיין הישן (jewishcalendar.netlify.app) לדומיין הראשי!
# ה-PWA הותקנו אצל המשתמשים מהדומיין הישן, ו-301 כפוי מנווט אותם אל מחוץ
# ל-scope של האפליקציה — אנדרואיד אז מציג סרגל כתובת + X במקום מסך מלא.
# במקומו: הפניית JS בדפדפן רגיל בלבד (ראו <head> של הדפים) + canonical לדומיין
# הראשי בכל הדפים — כך גוגל מאחד את הכפילות בלי לשבור את האפליקציות המותקנות.

# קבצי תשתית של הבילד — אין סיבה שיוגשו לגולשים (הוגשו עד כה כ-200)
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-year.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tailwind.config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tailwind.input.css"
  to = "/404.html"
  status = 404
  force = true

# ── כותרות אבטחה לכל האתר ──
# CSP מצומצם במכוון: frame-ancestors (מונע clickjacking), base-uri, object-src,
# form-action — הגנות אמיתיות בלי סיכון שבירה. CSP מלא עם script-src אינו מעשי
# כאן (עשרות סקריפטים inline ו-onclick=) והיה מחייב 'unsafe-inline' חסר-ערך.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Cross-Origin-Opener-Policy = "same-origin"

# ── מדיניות מטמון ──
# ברירת המחדל של Netlify היא max-age=0 (revalidation בכל בקשה). קבצי הקוד
# מוגנים בפרמטר ?v= (מוחלף בכל שינוי) וב-SW שמאמת מול השרת (cache:"no-cache"),
# כך שמותר להם מטמון קצר. חוקים לקובץ ספציפי — לא glob — כדי ש-Netlify לא
# ימזג שני ערכי Cache-Control לאותו נתיב (sw.js חייב להישאר ללא מטמון).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/lux.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# tailwind.css נוצר מחדש בכל דיפלוי אך ה-?v= שלו קבוע — לכן revalidation
# בכל בקשה (זול: 304 של קובץ קטן) במקום מטמון שעה שעלול להגיש CSS ישן.
[[headers]]
  for = "/tailwind.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# המניפסט הוגש כ-application/octet-stream — קובע MIME תקני ל-PWA
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
