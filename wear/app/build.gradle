plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'il.co.jewishcalendar.wear'
    compileSdk 36

    defaultConfig {
        // אותו applicationId כמו אפליקציית הטלפון — כך גרסת השעון יושבת באותו דף ב-Google Play
        // (מסלול Wear OS נפרד). versionCode של השעון בטווח משלו (1000+) כדי לא להתנגש בטלפון.
        applicationId 'il.co.jewishcalendar.twa'
        minSdk 30   // Wear OS 3 ומעלה
        targetSdk 36
        versionCode 1003
        versionName '1.0.2-wear'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.kosherjava:zmanim:2.5.0'

    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.wear.compose:compose-material3:1.5.6'
    implementation 'androidx.wear.compose:compose-foundation:1.5.6'
    implementation 'androidx.wear.compose:compose-navigation:1.5.6'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.wear.tiles:tiles:1.5.0'
    implementation 'androidx.wear.protolayout:protolayout:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'com.google.guava:guava:33.7.2-android'
    // סנכרון ההגדרות מהטלפון (Data Layer)
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    // play-services-wearable מושך fragment ישן (1.0) — ה-ActivityResult API דורש 1.3+ (lint חוסם release)
    implementation 'androidx.fragment:fragment:1.8.9'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
